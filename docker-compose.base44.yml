# Base44 sandbox/dev compose for THE VJ PULSE.
#
# The app is a single-process client-side SPA: Vite dev server (React + Tailwind),
# data comes from Firestore when reachable and falls back to bundled seed data /
# localStorage otherwise. There is no backend process and no required secret.
#
# Source is bind-mounted and the Vite dev server runs from it, so edits are picked
# up by HMR -- never bake the app into an image.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    command:
      - sh
      - -ec
      - bun install --frozen-lockfile && exec bun run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - vj_pulse_node_modules:/app/node_modules
    environment:
      # Set to 1 by the platform in the sandbox; passed through bare so it keeps
      # its original (unset) behaviour anywhere else.
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts (the preview proxy host).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    # The image ships bun + bash but not curl; probe with bun's fetch.
    # `vite dev` serves index.html, so a 200 here means the dev server is live.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: on-failure

volumes:
  vj_pulse_node_modules:
